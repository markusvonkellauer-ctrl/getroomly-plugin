name: Deploy

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push image to GHCR
    # Only main/development are real deploy targets. Guard manual
    # workflow_dispatch runs on other branches from building/deploying.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image + tags
        id: tags
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$REPO_LC"
          SHA_SHORT=${GITHUB_SHA::7}
          BRANCH_SLUG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${IMAGE}:latest,${IMAGE}:main-${SHA_SHORT}"
            PRIMARY="${IMAGE}:main-${SHA_SHORT}"
          else
            TAGS="${IMAGE}:${BRANCH_SLUG},${IMAGE}:${BRANCH_SLUG}-${SHA_SHORT}"
            PRIMARY="${IMAGE}:${BRANCH_SLUG}-${SHA_SHORT}"
          fi
          echo "image=${PRIMARY}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set deploy environment
        id: env
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/development" ]; then
            echo "compose_dir=/opt/getroomly-dev/compose" >> $GITHUB_OUTPUT
            echo "container=plugin-cdn-dev" >> $GITHUB_OUTPUT
            echo "compose_file=deploy/docker-compose.dev.yml" >> $GITHUB_OUTPUT
          else
            echo "compose_dir=/opt/getroomly/compose" >> $GITHUB_OUTPUT
            echo "container=plugin-cdn" >> $GITHUB_OUTPUT
            echo "compose_file=deploy/docker-compose.yml" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Install known_hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ship deploy compose to server
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p ${{ steps.env.outputs.compose_dir }}/plugin"
          scp ${{ steps.env.outputs.compose_file }} \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ steps.env.outputs.compose_dir }}/plugin/docker-compose.yml"

      - name: Pull image + roll the plugin container
        env:
          PLUGIN_IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSE_DIR: ${{ steps.env.outputs.compose_dir }}
          CONTAINER: ${{ steps.env.outputs.container }}
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -se <<EOF
            set -euo pipefail
            COMPOSE="${COMPOSE_DIR}/docker-compose.yml"

            echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin

            if ! grep -qE '^[[:space:]]*-[[:space:]]+path:[[:space:]]*\./plugin/docker-compose\.yml' "\$COMPOSE"; then
              if grep -qE '^  - path: \./frontend/docker-compose\.yml' "\$COMPOSE"; then
                sed -i '/^  - path: \.\/frontend\/docker-compose\.yml/a\  - path: ./plugin/docker-compose.yml' "\$COMPOSE"
              elif grep -qE '^  - path: \./backend/docker-compose\.yml' "\$COMPOSE"; then
                sed -i '/^  - path: \.\/backend\/docker-compose\.yml/a\  - path: ./plugin/docker-compose.yml' "\$COMPOSE"
              else
                sed -i '/^  - path: \.\/infra\/docker-compose\.yml/a\  - path: ./plugin/docker-compose.yml' "\$COMPOSE"
              fi
              echo "added plugin include to top-level compose"
            else
              echo "plugin include already present"
            fi

            cd "${COMPOSE_DIR}"
            export PLUGIN_IMAGE='${PLUGIN_IMAGE}'
            echo "Deploying image: \$PLUGIN_IMAGE to container: ${CONTAINER}"

            docker compose pull ${CONTAINER}
            docker compose up -d --remove-orphans ${CONTAINER}

            docker logout ghcr.io >/dev/null 2>&1 || true

            echo "Waiting for ${CONTAINER} to become healthy..."
            for i in {1..30}; do
              status=\$(docker inspect --format='{{.State.Health.Status}}' ${CONTAINER} 2>/dev/null || echo "starting")
              echo "  [\$i] container health: \$status"
              if [ "\$status" = "healthy" ]; then
                echo "OK ${CONTAINER} is healthy"
                docker compose ps ${CONTAINER}
                exit 0
              fi
              sleep 3
            done

            echo "FAIL ${CONTAINER} did not become healthy in 90s"
            docker compose ps ${CONTAINER}
            docker compose logs --tail=200 ${CONTAINER}
            exit 1
          EOF

      - name: Notify Slack
        if: always()
        run: |
          ENV=$([[ "${{ github.ref }}" == "refs/heads/main" ]] && echo "prod" || echo "dev")
          STATUS=$([[ "${{ job.status }}" == "success" ]] && echo "✅" || echo "❌")
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -se <<EOF
            . /opt/getroomly/secrets/slack-server-monitor.env
            [ -z "\$SLACK_WEBHOOK_URL" ] && exit 0
            curl -sS -X POST "\$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' -d '{
              "text": "${STATUS} *plugin* deployed to *${ENV}* — \`${GITHUB_SHA::7}\` by ${GITHUB_ACTOR} (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>)"
            }'
          EOF
